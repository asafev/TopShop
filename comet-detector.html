<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Browser Detector</title>
<script>
// CSP Violation listener — MUST be as early as possible
window.__cspViolations = [];
window.__cometCSPDetected = false;
document.addEventListener('securitypolicyviolation', function(e) {
    var v = {
        blockedURI: e.blockedURI,
        directive: e.effectiveDirective,
        source: e.sourceFile,
        line: e.lineNumber,
        sample: e.sample,
        time: performance.now()
    };
    window.__cspViolations.push(v);
    if (e.effectiveDirective === 'font-src' &&
        e.blockedURI && e.blockedURI.indexOf('perplexity.ai') !== -1) {
        window.__cometCSPDetected = true;
    }
});
// Font loading event listeners — catch injected font loads
window.__fontLoadEvents = [];
document.fonts.addEventListener('loading', function() {
    window.__fontLoadEvents.push({ type: 'loading', time: performance.now() });
});
document.fonts.addEventListener('loadingdone', function() {
    window.__fontLoadEvents.push({ type: 'loadingdone', time: performance.now() });
});
document.fonts.addEventListener('loadingerror', function() {
    window.__fontLoadEvents.push({ type: 'loadingerror', time: performance.now() });
});
// MutationObserver — catch style/link injections from content scripts
window.__cometMutations = [];
(function() {
    var obs = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
                var node = added[j];
                if (node.nodeType !== 1) continue;
                if (node.tagName === 'STYLE') {
                    var text = node.textContent || '';
                    if (text.indexOf('FKGrotesk') !== -1 || text.indexOf('FK Grotesk') !== -1 ||
                        text.indexOf('perplexity') !== -1 || text.indexOf('frontend-cdn') !== -1) {
                        window.__cometMutations.push({ type: 'style', content: text.substring(0, 500), time: performance.now() });
                    }
                }
                if (node.tagName === 'LINK' && node.rel === 'stylesheet' && node.href &&
                    node.href.indexOf('perplexity') !== -1) {
                    window.__cometMutations.push({ type: 'link', content: node.href, time: performance.now() });
                }
            }
        }
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<body>
<div class="container">
    <h1>🔎 Comet Browser Detector</h1>
    <p class="subtitle">Detects Perplexity's Comet browser via CSS injection fingerprinting + font detection (Mac + Windows).</p>

    <div id="verdict" class="verdict-box scanning">
        <div class="verdict-label">Detection Verdict</div>
        <div id="verdict-text" class="verdict-text scanning">SCANNING...</div>
        <div id="verdict-score" class="verdict-score">Running detection signals...</div>
    </div>

    <div id="signals-container"></div>

    <div class="footer">Comet Detector v2 — CSS Injection + Font Fingerprint (Mac + Windows)</div>
</div>

<script>
(function() {
    'use strict';

    const signals = [];
    let totalScore = 0;
    let maxScore = 0;

    function addSignal(id, name, desc, weight, category, testFn) {
        signals.push({ id, name, desc, weight, category, testFn, result: null });
        maxScore += weight;
    }

    // =====================================================================
    // CSP VIOLATION DETECTION (Mac+Windows — HIGHEST CONFIDENCE)
    // =====================================================================

    addSignal('csp-font-violation', 'CSP: Perplexity Font Load Blocked',
        'Comet injects @font-face CSS that attempts to load fonts from frontend-cdn.perplexity.ai. Our CSP blocks this, generating a SecurityPolicyViolation event we can catch.',
        95, 'CSS Injection Detection', async () => {
            // Wait up to 2 seconds for CSP violation to fire
            if (window.__cometCSPDetected) {
                const v = window.__cspViolations.find(x => x.blockedURI && x.blockedURI.indexOf('perplexity.ai') !== -1);
                return { hit: true, detail: `CSP BLOCKED perplexity font load!\nblockedURI: ${v ? v.blockedURI : 'perplexity.ai'}\ndirective: ${v ? v.directive : 'font-src'}\ntime: ${v ? v.time.toFixed(0) : '?'}ms\n→ DEFINITIVE: Comet injected @font-face pointing to Perplexity CDN` };
            }
            // Wait a bit more for late injections
            await new Promise(r => setTimeout(r, 1500));
            if (window.__cometCSPDetected) {
                const v = window.__cspViolations.find(x => x.blockedURI && x.blockedURI.indexOf('perplexity.ai') !== -1);
                return { hit: true, detail: `CSP BLOCKED perplexity font load (delayed)!\nblockedURI: ${v ? v.blockedURI : 'perplexity.ai'}\ndirective: font-src\n→ DEFINITIVE: Comet CSS injection detected` };
            }
            // Also check for any unexpected font-src violations
            const fontViolations = window.__cspViolations.filter(x => x.directive === 'font-src');
            if (fontViolations.length > 0) {
                return { hit: false, detail: `No perplexity.ai violations, but ${fontViolations.length} other font-src violation(s):\n${fontViolations.map(v => v.blockedURI).join('\n')}` };
            }
            return { hit: false, detail: 'No CSP font-src violations detected (no external font loads attempted).' };
        });

    addSignal('csp-any-perplexity', 'CSP: Any Perplexity Domain Blocked',
        'Catches any resource load attempt to perplexity.ai domains blocked by CSP (fonts, styles, scripts, etc).',
        80, 'CSS Injection Detection', async () => {
            await new Promise(r => setTimeout(r, 1000));
            const pplxViolations = window.__cspViolations.filter(v =>
                v.blockedURI && (v.blockedURI.indexOf('perplexity.ai') !== -1 || v.blockedURI.indexOf('perplexity') !== -1)
            );
            if (pplxViolations.length > 0) {
                const lines = pplxViolations.map(v => `  ${v.directive}: ${v.blockedURI} (@${v.time.toFixed(0)}ms)`);
                return { hit: true, detail: `${pplxViolations.length} perplexity resource(s) blocked by CSP:\n${lines.join('\n')}` };
            }
            return { hit: false, detail: `No resources from perplexity domains blocked. Total CSP violations: ${window.__cspViolations.length}` };
        });

    // =====================================================================
    // FONTFACESET ENUMERATION (Mac+Windows — HIGH CONFIDENCE)
    // =====================================================================

    addSignal('fontfaceset-enum', 'FontFaceSet: FK Grotesk Entries',
        'Enumerates document.fonts for FontFace objects with FK Grotesk family names. These appear when Comet injects @font-face CSS into the page DOM.',
        85, 'FontFaceSet API', async () => {
            await document.fonts.ready;
            // Extra delay for content script injection timing
            await new Promise(r => setTimeout(r, 800));
            
            const found = [];
            for (const face of document.fonts) {
                const family = (face.family || '').replace(/['"]/g, '');
                if (family.toLowerCase().indexOf('fkgrotesk') !== -1 ||
                    family.toLowerCase().indexOf('fk grotesk') !== -1 ||
                    family.toLowerCase().indexOf('perplexity') !== -1) {
                    found.push({
                        family: family,
                        status: face.status,
                        weight: face.weight,
                        style: face.style,
                        src: (face.src || '').substring(0, 150)
                    });
                }
            }
            if (found.length > 0) {
                const lines = found.map(f => `  "${f.family}" [${f.status}] w:${f.weight} src:${f.src || 'n/a'}`);
                return { hit: true, detail: `FK Grotesk found in document.fonts!\n${lines.join('\n')}\n→ Comet injected @font-face declarations into page` };
            }
            return { hit: false, detail: `document.fonts.size = ${document.fonts.size}, no FK Grotesk entries found.` };
        });

    addSignal('fontfaceset-size', 'FontFaceSet: Unexpected Font Count',
        'Our page declares zero @font-face rules. Any entries in document.fonts were injected externally.',
        40, 'FontFaceSet API', async () => {
            await document.fonts.ready;
            await new Promise(r => setTimeout(r, 800));
            const size = document.fonts.size;
            const fonts = [];
            for (const face of document.fonts) {
                fonts.push(`${(face.family || '').replace(/['"]/g, '')} [${face.status}]`);
            }
            if (size > 0) {
                return { hit: true, detail: `document.fonts.size = ${size} (expected 0!)\nInjected fonts: ${fonts.join(', ')}\n→ Something added @font-face rules we didn't declare` };
            }
            return { hit: false, detail: `document.fonts.size = 0 (clean — no injected @font-face rules)` };
        });

    addSignal('fontfaceset-load', 'FontFaceSet: FK Grotesk Loadable',
        'Attempts document.fonts.load() for FK Grotesk. Returns results only if a @font-face for it exists (injected by Comet).',
        75, 'FontFaceSet API', async () => {
            try {
                const results = await Promise.allSettled([
                    document.fonts.load('16px "FKGroteskNeue"'),
                    document.fonts.load('16px "FK Grotesk Neue"'),
                    document.fonts.load('16px "FK Grotesk"')
                ]);
                const loaded = [];
                const names = ['FKGroteskNeue', 'FK Grotesk Neue', 'FK Grotesk'];
                results.forEach((r, i) => {
                    if (r.status === 'fulfilled' && r.value.length > 0) {
                        loaded.push(`${names[i]} (${r.value.length} face(s))`);
                    }
                });
                if (loaded.length > 0) {
                    return { hit: true, detail: `fonts.load() found loadable FK Grotesk!\n${loaded.join('\n')}\n→ @font-face declared by Comet injection` };
                }
                return { hit: false, detail: 'fonts.load() returned empty for all FK Grotesk variants (not in FontFaceSet).' };
            } catch(e) {
                return { hit: false, detail: `Error: ${e.message}` };
            }
        });

    // =====================================================================
    // STYLESHEET INSPECTION (Mac+Windows — HIGH CONFIDENCE)
    // =====================================================================

    addSignal('stylesheet-fontface-src', 'Stylesheet: @font-face with Perplexity CDN URL',
        'Inspects all stylesheet rules for @font-face declarations with src URLs pointing to frontend-cdn.perplexity.ai.',
        90, 'Stylesheet Inspection', async () => {
            await new Promise(r => setTimeout(r, 800));
            const matches = [];
            for (let i = 0; i < document.styleSheets.length; i++) {
                try {
                    const sheet = document.styleSheets[i];
                    for (const rule of sheet.cssRules) {
                        if (rule instanceof CSSFontFaceRule) {
                            const src = rule.style.getPropertyValue('src') || '';
                            const family = rule.style.getPropertyValue('font-family') || '';
                            if (src.indexOf('perplexity') !== -1 ||
                                src.indexOf('FKGrotesk') !== -1 ||
                                family.toLowerCase().indexOf('fkgrotesk') !== -1 ||
                                family.toLowerCase().indexOf('fk grotesk') !== -1) {
                                matches.push({ family, src: src.substring(0, 200), sheetIdx: i });
                            }
                        }
                    }
                } catch(e) { /* CORS blocked */ }
            }
            if (matches.length > 0) {
                const lines = matches.map(m => `  "${m.family}" → ${m.src}`);
                return { hit: true, detail: `@font-face rules with Perplexity CDN found!\n${lines.join('\n')}\n→ DEFINITIVE CSS injection by Comet` };
            }
            return { hit: false, detail: `Scanned ${document.styleSheets.length} stylesheet(s) — no @font-face rules reference Perplexity.` };
        });

    addSignal('stylesheet-fkgrotesk-text', 'Stylesheet: <style> elements mentioning FK Grotesk',
        'Searches all <style> element textContent for FK Grotesk / perplexity references.',
        85, 'Stylesheet Inspection', async () => {
            await new Promise(r => setTimeout(r, 800));
            const styleEls = document.querySelectorAll('style');
            const findings = [];
            for (const el of styleEls) {
                const text = el.textContent || '';
                if (text.indexOf('FKGrotesk') !== -1 ||
                    text.indexOf('FK Grotesk') !== -1 ||
                    text.indexOf('perplexity.ai') !== -1 ||
                    text.indexOf('frontend-cdn.perplexity') !== -1) {
                    findings.push({
                        snippet: text.substring(0, 300),
                        parent: el.parentElement ? el.parentElement.tagName : 'unknown',
                        hasId: !!el.id
                    });
                }
            }
            if (findings.length > 0) {
                return { hit: true, detail: `${findings.length} <style> element(s) contain FK Grotesk/Perplexity references:\n${findings.map(f => f.snippet).join('\n---\n')}` };
            }
            return { hit: false, detail: `${styleEls.length} <style> element(s) checked — none reference FK Grotesk or Perplexity.` };
        });

    addSignal('stylesheet-count', 'Stylesheet: Count Anomaly',
        'Our page has exactly 1 <style>. Extra stylesheets indicate injection (weak signal — many extensions do this).',
        20, 'Stylesheet Inspection', async () => {
            await new Promise(r => setTimeout(r, 500));
            const expected = 1; // our single <style> block
            const actual = document.styleSheets.length;
            if (actual > expected) {
                const extras = [];
                for (let i = expected; i < actual; i++) {
                    const s = document.styleSheets[i];
                    extras.push(`  [${i}] href=${s.href || 'inline'} owner=${s.ownerNode ? s.ownerNode.tagName : '?'}`);
                }
                return { hit: true, detail: `Expected ${expected} stylesheet, found ${actual} (+${actual - expected} injected):\n${extras.join('\n')}` };
            }
            return { hit: false, detail: `Stylesheet count = ${actual} (matches expected ${expected})` };
        });

    // =====================================================================
    // PERFORMANCE RESOURCE TIMING (Mac+Windows — HIGH CONFIDENCE)
    // =====================================================================

    addSignal('perf-resource-perplexity', 'Performance: Resource Timing from Perplexity Domains',
        'Checks performance.getEntriesByType("resource") for any requests to perplexity.ai domains we did not initiate.',
        80, 'Network/Resource Detection', async () => {
            await new Promise(r => setTimeout(r, 1200));
            const entries = performance.getEntriesByType('resource');
            const pplx = entries.filter(e =>
                e.name.indexOf('perplexity.ai') !== -1 ||
                e.name.indexOf('FKGrotesk') !== -1 ||
                e.name.indexOf('fkgrotesk') !== -1
            );
            if (pplx.length > 0) {
                const lines = pplx.map(e => `  ${e.initiatorType}: ${e.name} (${e.duration.toFixed(0)}ms)`);
                return { hit: true, detail: `${pplx.length} resource(s) loaded from Perplexity domains:\n${lines.join('\n')}\n→ Comet fetched resources into our page context` };
            }
            return { hit: false, detail: `${entries.length} resource entries — none from perplexity.ai (likely blocked by CSP if Comet is present)` };
        });

    // =====================================================================
    // FONT LOADING EVENTS (Mac+Windows)
    // =====================================================================

    addSignal('font-load-events', 'Font Events: Unexpected Loading Activity',
        'Our page declares no @font-face. Any font loading/loadingerror events indicate injected font declarations.',
        50, 'FontFaceSet API', async () => {
            await new Promise(r => setTimeout(r, 1500));
            const events = window.__fontLoadEvents || [];
            if (events.length > 0) {
                const lines = events.map(e => `  ${e.type} @ ${e.time.toFixed(0)}ms`);
                const hasError = events.some(e => e.type === 'loadingerror');
                return {
                    hit: true,
                    detail: `${events.length} font loading event(s) fired (we declared NO @font-face!):\n${lines.join('\n')}${hasError ? '\n→ loadingerror = CSP blocked an injected font load!' : '\n→ Something injected @font-face rules'}`
                };
            }
            return { hit: false, detail: 'No font loading events fired (expected — we have no @font-face).' };
        });

    // =====================================================================
    // MUTATION OBSERVER RESULTS (Mac+Windows)
    // =====================================================================

    addSignal('mutation-perplexity-style', 'MutationObserver: Perplexity Style Injection',
        'A MutationObserver running since page start catches <style>/<link> elements injected with Perplexity content.',
        85, 'CSS Injection Detection', async () => {
            await new Promise(r => setTimeout(r, 1200));
            // Check if our early observer caught anything
            if (window.__cometMutations && window.__cometMutations.length > 0) {
                const lines = window.__cometMutations.map(m => `  ${m.type}: ${m.content.substring(0, 150)}`);
                return { hit: true, detail: `MutationObserver caught ${window.__cometMutations.length} Perplexity injection(s):\n${lines.join('\n')}` };
            }
            return { hit: false, detail: 'MutationObserver: No Perplexity-related DOM injections observed.' };
        });

    // =====================================================================
    // FONT FINGERPRINTING (MVP — definitive Comet signal on Windows, works on Mac after font loads)
    // =====================================================================

    addSignal('font-fkgrotesk', 'Font: FK Grotesk Neue / FK Grotesk Availability',
        'Comet bundles Perplexity\'s custom "FK Grotesk Neue" and "FK Grotesk" fonts. On Windows they\'re installed system-wide. On Mac they may only be available after Comet injects @font-face CSS. Detected via canvas text width comparison.',
        90, 'Font Fingerprint', async () => {
            // Wait for any injected fonts to finish loading (critical for Mac)
            await document.fonts.ready;
            await new Promise(r => setTimeout(r, 600));
            await document.fonts.ready;
            
            const testString = 'mmmmmmmmmmlli10OoQq@#$%';
            const testSize = '72px';
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Get baseline widths for fallback fonts
            ctx.font = `${testSize} monospace`;
            const monoWidth = ctx.measureText(testString).width;
            ctx.font = `${testSize} serif`;
            const serifWidth = ctx.measureText(testString).width;

            // Probe all known name variants of the Perplexity font
            const fontNames = [
                'FK Grotesk Neue',   // actual system font name (confirmed hit)
                'FK Grotesk',        // shorter variant (confirmed hit)
                'FKGroteskNeue',     // CSS reference in content.js (no space)
                'FK Grotesk Neue Regular',
                'FKGrotesk',
            ];

            const detected = [];
            for (const fontName of fontNames) {
                ctx.font = `${testSize} "${fontName}", monospace`;
                const wMono = ctx.measureText(testString).width;
                ctx.font = `${testSize} "${fontName}", serif`;
                const wSerif = ctx.measureText(testString).width;

                const deltaM = Math.abs(wMono - monoWidth);
                const deltaS = Math.abs(wSerif - serifWidth);

                if (deltaM > 0.1 || deltaS > 0.1) {
                    detected.push({ name: fontName, deltaMono: deltaM, deltaSerif: deltaS, widthMono: wMono, widthSerif: wSerif });
                }
            }

            if (detected.length > 0) {
                const lines = detected.map(d =>
                    `  "${d.name}": mono Δ${d.deltaMono.toFixed(2)}px, serif Δ${d.deltaSerif.toFixed(2)}px`
                );
                return { hit: true, detail: `PERPLEXITY FONTS DETECTED! (${detected.length}/${fontNames.length} variants found)\n${lines.join('\n')}\nBaseline mono: ${monoWidth.toFixed(2)}px, serif: ${serifWidth.toFixed(2)}px\n→ These fonts are exclusively bundled with Comet browser!` };
            }
            return { hit: false, detail: `No FK Grotesk variants available.\nProbed: ${fontNames.join(', ')}\nBaseline mono: ${monoWidth.toFixed(2)}px, serif: ${serifWidth.toFixed(2)}px\nAll returned identical width to fallback (font not installed).` };
        });

    addSignal('font-perplexity-set', 'Font: Extended Perplexity Font Family',
        'Probes for weight variants and additional Perplexity-associated fonts beyond the core FK Grotesk detection. More hits = higher confidence.',
        70, 'Font Fingerprint', async () => {
            await document.fonts.ready;
            await new Promise(r => setTimeout(r, 600));
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const testStr = 'mmmWWWiii000QQQ';
            const size = '48px';
            const detected = [];

            const fontsToProbe = [
                // Weight variants
                'FK Grotesk Neue Bold', 'FK Grotesk Neue Medium', 'FK Grotesk Neue Light',
                'FK Grotesk Bold', 'FK Grotesk Medium', 'FK Grotesk Light',
                'FKGroteskNeue Bold', 'FKGroteskNeue Medium', 'FKGroteskNeue Light',
                // Other Perplexity product fonts
                'Perplexity Sans', 'PP Neue Montreal',
                // AI product fonts sometimes co-bundled
                'Sohne', 'Sohne Mono', 'Inter var',
            ];

            ctx.font = `${size} monospace`;
            const baseWidth = ctx.measureText(testStr).width;

            for (const font of fontsToProbe) {
                ctx.font = `${size} "${font}", monospace`;
                const w = ctx.measureText(testStr).width;
                if (Math.abs(w - baseWidth) > 0.1) {
                    detected.push(`${font} (Δ${(w - baseWidth).toFixed(2)}px)`);
                }
            }

            if (detected.length > 0) {
                return { hit: true, detail: `${detected.length} additional Perplexity fonts found:\n${detected.join('\n')}\n→ Confirms Comet browser with full Perplexity font stack` };
            }
            return { hit: false, detail: `None of the ${fontsToProbe.length} extended font variants are available.` };
        });

    // =====================================================================
    // EXECUTION ENGINE
    // =====================================================================

    async function runAllSignals() {
        totalScore = 0;
        const container = document.getElementById('signals-container');
        const categories = {};
        for (const sig of signals) {
            if (!categories[sig.category]) categories[sig.category] = [];
            categories[sig.category].push(sig);
        }

        for (const sig of signals) {
            try {
                sig.result = await sig.testFn();
            } catch (e) {
                sig.result = { hit: false, detail: `Error: ${e.message}` };
            }
            if (sig.result.hit) totalScore += sig.weight;
        }

        container.innerHTML = '';
        for (const [cat, sigs] of Object.entries(categories)) {
            const hits = sigs.filter(s => s.result?.hit).length;
            const section = document.createElement('div');
            section.className = 'section';
            section.innerHTML = `<div class="section-title">${cat} <span style="float:right;color:${hits > 0 ? '#ff4444' : '#44ff44'};font-size:0.85em;">${hits}/${sigs.length} hit</span></div>`;
            const signalsDiv = document.createElement('div');
            signalsDiv.className = 'signals';
            for (const sig of sigs) {
                const r = sig.result || { hit: false, detail: 'Not run' };
                const div = document.createElement('div');
                div.className = `signal ${r.hit ? 'hit' : 'miss'}`;
                div.innerHTML = `
                    <div class="signal-icon">${r.hit ? '🚨' : '✅'}</div>
                    <div class="signal-body">
                        <div class="signal-name">${sig.name}</div>
                        <div class="signal-desc">${sig.desc}</div>
                        <div class="signal-detail">${r.detail}</div>
                    </div>
                    <div class="signal-weight">w:${sig.weight}</div>`;
                signalsDiv.appendChild(div);
            }
            section.appendChild(signalsDiv);
            container.appendChild(section);
        }
        updateVerdict();
    }

    function updateVerdict() {
        const box = document.getElementById('verdict');
        const text = document.getElementById('verdict-text');
        const score = document.getElementById('verdict-score');
        const hitCount = signals.filter(s => s.result?.hit).length;

        if (totalScore >= 80) {
            box.className = 'verdict-box detected';
            text.className = 'verdict-text detected';
            text.textContent = '🚨 COMET BROWSER DETECTED';
            score.textContent = `Score: ${totalScore}/${maxScore} — ${hitCount}/${signals.length} signals triggered`;
        } else if (totalScore > 0) {
            box.className = 'verdict-box detected';
            text.className = 'verdict-text detected';
            text.textContent = '⚠️ SUSPICIOUS (Possible Comet/Brave-based)';
            score.textContent = `Score: ${totalScore}/${maxScore} — ${hitCount}/${signals.length} signals triggered`;
        } else {
            box.className = 'verdict-box clean';
            text.className = 'verdict-text clean';
            text.textContent = '✓ NO COMET DETECTED';
            score.textContent = `Score: 0/${maxScore} — No Comet signals found`;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runAllSignals);
    } else {
        runAllSignals();
    }
})();
</script>
</body>
</html>
