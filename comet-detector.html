<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Browser Detector</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; padding: 20px; }
.container { max-width: 960px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 8px; font-size: 1.8em; }
.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
.verdict-box { text-align: center; padding: 24px; border-radius: 12px; margin-bottom: 30px; transition: all 0.5s; }
.verdict-box.scanning { background: #1a1a2e; border: 2px solid #444; }
.verdict-box.detected { background: #1a0a0a; border: 2px solid #ff4444; box-shadow: 0 0 30px rgba(255,50,50,0.2); }
.verdict-box.clean { background: #0a1a0a; border: 2px solid #44ff44; box-shadow: 0 0 30px rgba(50,255,50,0.1); }
.verdict-label { font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px; color: #888; }
.verdict-text { font-size: 2em; font-weight: bold; margin: 8px 0; }
.verdict-text.detected { color: #ff4444; }
.verdict-text.clean { color: #44ff44; }
.verdict-text.scanning { color: #ffaa00; }
.verdict-score { font-size: 0.9em; color: #aaa; }
.section { margin-bottom: 20px; }
.section-title { font-size: 1.1em; font-weight: 600; padding: 10px 14px; background: #12121a; border-radius: 8px 8px 0 0; border: 1px solid #222; border-bottom: none; }
.signals { border: 1px solid #222; border-radius: 0 0 8px 8px; overflow: hidden; }
.signal { display: flex; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid #1a1a1a; transition: background 0.3s; }
.signal:last-child { border-bottom: none; }
.signal.hit { background: rgba(255,50,50,0.05); }
.signal.miss { background: rgba(50,255,50,0.02); }
.signal-icon { width: 28px; font-size: 1.2em; flex-shrink: 0; margin-top: 2px; }
.signal-body { flex: 1; }
.signal-name { font-weight: 600; font-size: 0.95em; }
.signal-desc { font-size: 0.8em; color: #777; margin-top: 2px; }
.signal-detail { font-size: 0.78em; color: #999; margin-top: 4px; font-family: 'Cascadia Code', 'Fira Code', monospace; background: #0d0d14; padding: 4px 8px; border-radius: 4px; word-break: break-all; white-space: pre-wrap; }
.signal-weight { font-size: 0.75em; color: #555; margin-left: 8px; white-space: nowrap; }
.footer { text-align: center; margin-top: 30px; font-size: 0.75em; color: #555; }
</style>
</head>
<body>
<div class="container">
    <h1>🔎 Comet Browser Detector</h1>
    <p class="subtitle">Detects Perplexity's Comet browser via font fingerprinting (FKGroteskNeue + FK Grotesk family).</p>

    <div id="verdict" class="verdict-box scanning">
        <div class="verdict-label">Detection Verdict</div>
        <div id="verdict-text" class="verdict-text scanning">SCANNING...</div>
        <div id="verdict-score" class="verdict-score">Running detection signals...</div>
    </div>

    <div id="signals-container"></div>

    <div class="footer">Comet Detector — Font Fingerprint</div>
</div>

<script>
(function() {
    'use strict';

    const signals = [];
    let totalScore = 0;
    let maxScore = 0;

    function addSignal(id, name, desc, weight, category, testFn) {
        signals.push({ id, name, desc, weight, category, testFn, result: null });
        maxScore += weight;
    }

    // =====================================================================
    // FONT FINGERPRINTING (MVP — definitive Comet signal)
    // =====================================================================

    addSignal('font-fkgrotesk', 'Font: FK Grotesk Neue / FK Grotesk Availability',
        'Comet bundles Perplexity\'s custom "FK Grotesk Neue" and "FK Grotesk" fonts system-wide. These fonts do NOT exist in any other browser. Detected via canvas text width comparison against fallback fonts.',
        90, 'Font Fingerprint', () => {
            const testString = 'mmmmmmmmmmlli10OoQq@#$%';
            const testSize = '72px';
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Get baseline widths for fallback fonts
            ctx.font = `${testSize} monospace`;
            const monoWidth = ctx.measureText(testString).width;
            ctx.font = `${testSize} serif`;
            const serifWidth = ctx.measureText(testString).width;

            // Probe all known name variants of the Perplexity font
            const fontNames = [
                'FK Grotesk Neue',   // actual system font name (confirmed hit)
                'FK Grotesk',        // shorter variant (confirmed hit)
                'FKGroteskNeue',     // CSS reference in content.js (no space)
                'FK Grotesk Neue Regular',
                'FKGrotesk',
            ];

            const detected = [];
            for (const fontName of fontNames) {
                ctx.font = `${testSize} "${fontName}", monospace`;
                const wMono = ctx.measureText(testString).width;
                ctx.font = `${testSize} "${fontName}", serif`;
                const wSerif = ctx.measureText(testString).width;

                const deltaM = Math.abs(wMono - monoWidth);
                const deltaS = Math.abs(wSerif - serifWidth);

                if (deltaM > 0.1 || deltaS > 0.1) {
                    detected.push({ name: fontName, deltaMono: deltaM, deltaSerif: deltaS, widthMono: wMono, widthSerif: wSerif });
                }
            }

            if (detected.length > 0) {
                const lines = detected.map(d =>
                    `  "${d.name}": mono Δ${d.deltaMono.toFixed(2)}px, serif Δ${d.deltaSerif.toFixed(2)}px`
                );
                return { hit: true, detail: `PERPLEXITY FONTS DETECTED! (${detected.length}/${fontNames.length} variants found)\n${lines.join('\n')}\nBaseline mono: ${monoWidth.toFixed(2)}px, serif: ${serifWidth.toFixed(2)}px\n→ These fonts are exclusively bundled with Comet browser!` };
            }
            return { hit: false, detail: `No FK Grotesk variants available.\nProbed: ${fontNames.join(', ')}\nBaseline mono: ${monoWidth.toFixed(2)}px, serif: ${serifWidth.toFixed(2)}px\nAll returned identical width to fallback (font not installed).` };
        });

    addSignal('font-perplexity-set', 'Font: Extended Perplexity Font Family',
        'Probes for weight variants and additional Perplexity-associated fonts beyond the core FK Grotesk detection. More hits = higher confidence.',
        70, 'Font Fingerprint', () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const testStr = 'mmmWWWiii000QQQ';
            const size = '48px';
            const detected = [];

            const fontsToProbe = [
                // Weight variants
                'FK Grotesk Neue Bold', 'FK Grotesk Neue Medium', 'FK Grotesk Neue Light',
                'FK Grotesk Bold', 'FK Grotesk Medium', 'FK Grotesk Light',
                'FKGroteskNeue Bold', 'FKGroteskNeue Medium', 'FKGroteskNeue Light',
                // Other Perplexity product fonts
                'Perplexity Sans', 'PP Neue Montreal',
                // AI product fonts sometimes co-bundled
                'Sohne', 'Sohne Mono', 'Inter var',
            ];

            ctx.font = `${size} monospace`;
            const baseWidth = ctx.measureText(testStr).width;

            for (const font of fontsToProbe) {
                ctx.font = `${size} "${font}", monospace`;
                const w = ctx.measureText(testStr).width;
                if (Math.abs(w - baseWidth) > 0.1) {
                    detected.push(`${font} (Δ${(w - baseWidth).toFixed(2)}px)`);
                }
            }

            if (detected.length > 0) {
                return { hit: true, detail: `${detected.length} additional Perplexity fonts found:\n${detected.join('\n')}\n→ Confirms Comet browser with full Perplexity font stack` };
            }
            return { hit: false, detail: `None of the ${fontsToProbe.length} extended font variants are available.` };
        });

    // =====================================================================
    // EXECUTION ENGINE
    // =====================================================================

    async function runAllSignals() {
        totalScore = 0;
        const container = document.getElementById('signals-container');
        const categories = {};
        for (const sig of signals) {
            if (!categories[sig.category]) categories[sig.category] = [];
            categories[sig.category].push(sig);
        }

        for (const sig of signals) {
            try {
                sig.result = await sig.testFn();
            } catch (e) {
                sig.result = { hit: false, detail: `Error: ${e.message}` };
            }
            if (sig.result.hit) totalScore += sig.weight;
        }

        container.innerHTML = '';
        for (const [cat, sigs] of Object.entries(categories)) {
            const hits = sigs.filter(s => s.result?.hit).length;
            const section = document.createElement('div');
            section.className = 'section';
            section.innerHTML = `<div class="section-title">${cat} <span style="float:right;color:${hits > 0 ? '#ff4444' : '#44ff44'};font-size:0.85em;">${hits}/${sigs.length} hit</span></div>`;
            const signalsDiv = document.createElement('div');
            signalsDiv.className = 'signals';
            for (const sig of sigs) {
                const r = sig.result || { hit: false, detail: 'Not run' };
                const div = document.createElement('div');
                div.className = `signal ${r.hit ? 'hit' : 'miss'}`;
                div.innerHTML = `
                    <div class="signal-icon">${r.hit ? '🚨' : '✅'}</div>
                    <div class="signal-body">
                        <div class="signal-name">${sig.name}</div>
                        <div class="signal-desc">${sig.desc}</div>
                        <div class="signal-detail">${r.detail}</div>
                    </div>
                    <div class="signal-weight">w:${sig.weight}</div>`;
                signalsDiv.appendChild(div);
            }
            section.appendChild(signalsDiv);
            container.appendChild(section);
        }
        updateVerdict();
    }

    function updateVerdict() {
        const box = document.getElementById('verdict');
        const text = document.getElementById('verdict-text');
        const score = document.getElementById('verdict-score');
        const hitCount = signals.filter(s => s.result?.hit).length;

        if (totalScore >= 80) {
            box.className = 'verdict-box detected';
            text.className = 'verdict-text detected';
            text.textContent = '🚨 COMET BROWSER DETECTED';
            score.textContent = `Score: ${totalScore}/${maxScore} — ${hitCount}/${signals.length} signals triggered`;
        } else if (totalScore > 0) {
            box.className = 'verdict-box detected';
            text.className = 'verdict-text detected';
            text.textContent = '⚠️ SUSPICIOUS (Possible Comet/Brave-based)';
            score.textContent = `Score: ${totalScore}/${maxScore} — ${hitCount}/${signals.length} signals triggered`;
        } else {
            box.className = 'verdict-box clean';
            text.className = 'verdict-text clean';
            text.textContent = '✓ NO COMET DETECTED';
            score.textContent = `Score: 0/${maxScore} — No Comet signals found`;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runAllSignals);
    } else {
        runAllSignals();
    }
})();
</script>
</body>
</html>
