<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLIC Target Detector</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    body {
      box-sizing: border-box;
      width: 440px;
      margin: 0;
      padding: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    button {
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 6px;
      padding: 8px 12px;
      background: ButtonFace;
      color: ButtonText;
      font: inherit;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .metric {
      border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      border-radius: 6px;
      padding: 8px;
    }

    .metric strong {
      display: block;
      font-size: 12px;
      color: color-mix(in srgb, CanvasText 70%, transparent);
    }

    .metric span {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    pre {
      box-sizing: border-box;
      max-height: 330px;
      margin: 0;
      overflow: auto;
      border-radius: 6px;
      padding: 10px;
      background: color-mix(in srgb, CanvasText 8%, Canvas 92%);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>GLIC Target Detector</h1>
  <button id="scan" type="button">Scan Chrome targets</button>

  <div class="summary">
    <div class="metric">
      <strong>Detected</strong>
      <span id="detected">-</span>
    </div>
    <div class="metric">
      <strong>GLIC targets</strong>
      <span id="glicCount">-</span>
    </div>
    <div class="metric">
      <strong>Gemini targets</strong>
      <span id="geminiCount">-</span>
    </div>
  </div>

  <pre id="output">Click scan.</pre>

  <script src="popup.js"></script>
</body>
</html>
