<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f7f9;
      color: #18202a;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      text-align: center;
      max-width: 420px;
    }
    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ecfdf3;
      display: grid;
      place-items: center;
      color: #067647;
      font-size: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #667085; font-size: 15px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main>
    <div class="check">&#10003;</div>
    <h1>Thank you</h1>
    <p>Your details have been saved.</p>
  </main>
</body>
</html>
